<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
  <h1>Donation Form</h1>
  <form>
    
    
    <input type="text" id="name" name="name" required>
<label input="text" for="name" id="name">Full Name:</label>
    
    <input type="email" id="email" name="email" required>
<label type="email" for="email" id="email">Email Address:</label>
    
    <input type="number" id="amount" name="amount" required>
<label type="number" for="amount" id="amount">Donation Amount ($):</label>
    <input id="newsletter" type="checkbox" name="newsletter">
    
<label type="checkbox" for="newsletter" id="newsletter">Subscribe</label>
    <input type="submit" value="Send">
  </form>
</body>
</html>
